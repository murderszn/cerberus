name: ci

on:
  push:
  pull_request:

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # Validates the catalog (unique IDs, weights sum to 100, regexes compile in
      # both Python and ES2018) and regenerates assets/checks.js.
      - name: Validate and build check catalog
        run: python3 scripts/build-checks.py

      # assets/checks.js is generated. If it drifts from checks.json the web app and
      # the CLI silently disagree, so a stale artifact fails the build.
      - name: Fail if generated catalog is stale
        run: git diff --exit-code assets/checks.js

      # Offline engine tests: report schema, counts invariants, and targeted check
      # outcomes against synthetic directories (no network).
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      # The project ships a security scanner, so it holds itself to a gate
      # with teeth: any high-or-worse finding fails the build even at a
      # passing score, and the score floor sits at 95, not 80.
      - name: Self-scan
        run: python3 examine.py . --fail-under 95 --fail-on high
